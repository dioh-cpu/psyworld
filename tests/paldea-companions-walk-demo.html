<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8"><base href="/">
<title>PSYWORLD · Companions walk review</title>
<style>
body{margin:0;background:#101c2c;color:#e5f1f7;font:16px system-ui}canvas{display:block;margin:auto}#psy-follower-launch{display:none}p{text-align:center}button{font:inherit;padding:8px 20px}
</style>
<canvas id="demo" width="1280" height="880" aria-label="Sprigatito, Fuecoco e Pawmi normais e Shiny"></canvas>
<p><button onclick="demo.restart()">Recomeçar</button> Controlador e arte reais · cenário de inspeção, não mapa de produção</p>
<script>
window.P={meta:{followerV47:{enabled:true,key:'906-normal'}},team:[906,909,921].flatMap(id=>[false,true].map(shiny=>({id,hp:100,pokemon_uid:id+'-'+(shiny?'shiny':'normal'),shiny})))};
</script>
<script src="core/trainer-walk-v1.js"></script>
<script src="core/follower-v47.js"></script>
<script>
(async()=>{
 const canvas=document.getElementById('demo'),c=canvas.getContext('2d');
 const trainer=new Image();trainer.src='assets/characters/halloween/basic-adventure-boy.webp';await trainer.decode();
 // Warm both actual atlas pages before starting the recording.
 await Promise.all(['normal','shiny'].map(async kind=>{const im=new Image();im.src='assets/followers/pages/'+kind+'-14.webp';await im.decode();}));
 while(!PsyFollower.manifest()[912])await new Promise(r=>setTimeout(r,10));
 const atlas=PsyTrainerWalkV1.getAtlas(trainer);
 const species=[{id:906,name:'Sprigatito',cadence:115},{id:909,name:'Fuecoco',cadence:170},{id:921,name:'Pawmi',cadence:125}];
 const stages=[
  {ms:800,to:[50,65],name:'Parados · apoio estável'},
  {ms:2400,to:[150,65],name:'Direita · passos tranquilos',dir:'right'},
  {ms:1600,to:[150,130],name:'Curva → baixo',dir:'down'},
  {ms:1000,to:[150,130],name:'Parada · sem deslizar'},
  {ms:2400,to:[50,130],name:'Retomada → esquerda',dir:'left'},
  {ms:1600,to:[50,65],name:'Curva → cima',dir:'up'},
  {ms:1000,to:[50,65],name:'Parada estável'},
  {ms:1400,to:[150,65],name:'Retomada · deslocamento mais rápido',dir:'right'},
  {ms:900,to:[150,130],name:'Curva → baixo · mesma cadência',dir:'down'},
  {ms:800,to:[150,130],name:'Parada'},
  {ms:1400,to:[50,130],name:'Retomada → esquerda',dir:'left'},
  {ms:900,to:[50,65],name:'Curva → cima',dir:'up'},
  {ms:1800,to:[50,65],name:'Parada final · apoio e sombra estáveis'}
 ];
 const duration=stages.reduce((sum,s)=>sum+s.ms,0);let start=performance.now(),facing='down';
 function route(t){let from=[50,65];for(const s of stages){if(t<=s.ms){const k=Math.max(0,t/s.ms);return {x:from[0]+(s.to[0]-from[0])*k,y:from[1]+(s.to[1]-from[1])*k,moving:from[0]!==s.to[0]||from[1]!==s.to[1],label:s.name,dir:s.dir};}t-=s.ms;from=s.to;}return {x:50,y:65,moving:false,label:'Fim · revisão',dir:'down'};}
 function render(t){
  const p=route(Math.min(t,duration));if(p.dir)facing=p.dir;if(window.demo)demo.state={...p,time:t};
  c.fillStyle='#101c2c';c.fillRect(0,0,1280,880);c.fillStyle='#87dec8';c.font='bold 18px system-ui';c.fillText('PSYWORLD ANIMATION STUDIO',28,35);
  c.fillStyle='#eef7fb';c.font='bold 25px system-ui';c.fillText('Sprigatito · Fuecoco · Pawmi — normal e Shiny',28,71);
  species.forEach(({id,name},column)=>['normal','shiny'].forEach((kind,row)=>{
   c.save();c.translate(column*426+12,row*350+101);c.fillStyle=row?'#abc7f5':'#bce8cf';c.font='bold 20px system-ui';c.fillText(name+' · '+(row?'SHINY':'NORMAL'),8,0);
   c.translate(0,17);c.fillStyle='#385447';c.fillRect(0,0,400,300);c.save();c.scale(2,2);
   for(let y=0;y<150;y+=16)for(let x=0;x<200;x+=16){c.fillStyle=(x+y)%32?'#3e5b4c':'#426151';c.fillRect(x,y,Math.min(16,200-x),Math.min(16,150-y));}
   c.strokeStyle='#b9d1af66';c.setLineDash([2,3]);c.lineWidth=.5;c.strokeRect(50,65,100,65);c.setLineDash([]);
   P.meta.followerV47.key=id+'-'+kind;
   PsyFollower.draw(c,{scene:'companions-review:'+id+':'+kind,x:p.x,y:p.y,moving:p.moving,facing,valid:()=>true,trainer:()=>{
    // Reveal the follower's front feet when the trainer would occlude them.
    c.save();c.globalAlpha=facing==='down'?.32:1;
    c.fillStyle='#0008';c.beginPath();c.ellipse(p.x,p.y+5,13,5,0,0,Math.PI*2);c.fill();
    const row={down:0,left:1,right:2,up:3}[facing];
    PsyTrainerWalkV1.draw(c,atlas,row,PsyTrainerWalkV1.column(Math.floor(t/100),p.moving),p.x-24,p.y+7-64,48,64);c.restore();
   }});
   c.restore();c.restore();
  }));
  c.fillStyle='#e7f4ed';c.font='bold 21px system-ui';c.fillText(p.label,30,814);
  c.fillStyle='#abc0d0';c.font='15px system-ui';c.fillText('Sprigatito 115 ms · Fuecoco 170 ms · Pawmi 125 ms/pose | Treinador translúcido na vista frontal · ×2',30,850);
  return p;
 }
 function restart(){
  PsyFollower.clear();start=performance.now();facing='right';
  // Seed the same production trail so idle starts at the normal following gap.
  const warm=document.createElement('canvas').getContext('2d');
  for(const {id}of species)for(const kind of ['normal','shiny']){
   P.meta.followerV47.key=id+'-'+kind;
   for(const x of [14,50])PsyFollower.draw(warm,{scene:'companions-review:'+id+':'+kind,x,y:65,moving:true,facing:'right',valid:()=>true});
  }
 }
 window.demo={duration,species,render,restart,ready:true};restart();
 function loop(){render(performance.now()-start);requestAnimationFrame(loop)}loop();
})();
</script>
</html>
