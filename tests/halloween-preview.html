<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PSYWORLD · Verificação de Halloween</title><style>body{margin:0;background:#11182c;color:#fff;font:14px system-ui}main{max-width:680px;margin:20px auto;padding:16px}button{padding:12px;border:1px solid #ba9770;background:#31324d;color:white;border-radius:10px;margin:5px}img.creature{width:180px;height:180px;object-fit:contain}p{line-height:1.6}.demo-trainer{display:block;width:180px;height:180px;background:#1d2940;border-radius:100px;margin:15px auto}#preview-title{width:100%;height:70px}</style>
<main><h1>Halloween · Verificação visual</h1><p>Perfil temporário de teste. Este arquivo não lê nem grava saves reais.</p><div id="demo-art"></div><canvas id="preview-title" width="640" height="70"></canvas><button id="shop">Abrir loja da Amora</button><button id="scare">Encontro de Halloween</button><button id="loot">Mostrar saque</button><button id="config">Visibilidade</button><button id="theme">Alternar tema</button><div id="config-panel"></div><pre id="result"></pre></main>
<script>var P={meta:{},inventory:{'Doce de Halloween':10000,'Incenso de Halloween':2},settings:{},trainerLevel:200,team:[],box:[{id:37,halloweenForm:'luminox',name:'Luminox de Halloween',level:5,hp:50,maxHp:100,rarity:{mult:1}},{id:41,halloweenForm:'noctilume',name:'Noctilume de Halloween',level:5,hp:50,maxHp:100,rarity:{mult:1}},{id:32,halloweenForm:'brumelo',name:'Brumelo de Halloween',level:5,hp:50,maxHp:100,rarity:{mult:1}},{id:16,halloweenForm:'corujack',name:'Corujack de Halloween',level:5,hp:50,maxHp:100,rarity:{mult:1}}]};window.autoSave=()=>{};window.notif=t=>document.querySelector('#result').textContent=t;window.getTotalBuff=()=>100;</script>
<script src="../core/seasonal-event-v1.js?build=HALLOWEEN_ECONOMY_V24"></script><script src="../core/audio.js?build=HALLOWEEN_ECONOMY_V23"></script>
<script>
// Resolve asset paths relative to the game root, exactly as the game does.
const base=document.createElement('base');base.href='../';document.head.prepend(base);
const E=window.PsySeason;E.state().titles={moon:true,lantern:true,sweets:true,sovereign:true};E.equip('sovereign');
document.querySelector('#demo-art').innerHTML=E.forms.map(f=>'<img class="creature" src="assets/events/halloween/'+f.file+'" alt="'+f.name+'">').join('');
document.querySelector('#shop').onclick=()=>E.openShop();document.querySelector('#scare').onclick=()=>E.encounter({id:41,name:'Noctilume de Halloween',halloweenForm:'noctilume'});document.querySelector('#loot').onclick=()=>E.loot([{name:'Doce de Halloween',qty:6},{name:'Ultra Ball',qty:1},{name:'Fire Stone',qty:1}]);document.querySelector('#config').onclick=()=>{const gallery=document.createElement('button');gallery.textContent='VER FORMAS SHINY E MEGA';gallery.onclick=()=>{document.querySelector('#demo-art').innerHTML=E.forms.flatMap(f=>['','-shiny','-mega','-shiny-mega'].map(v=>'<img class="creature" src="assets/events/halloween/'+f.key+v+'.webp" alt="'+f.name+v+'">')).join('')};document.querySelector('main').append(gallery);
const c=document.querySelector('#config-panel');c.innerHTML=E.visibilityHTML();E.bindSettings(c)};document.querySelector('#theme').onclick=()=>E.setSeason(E.on()?'none':'halloween');
const gallery=document.createElement('button');gallery.textContent='VER FORMAS SHINY E MEGA';gallery.onclick=()=>{document.querySelector('#demo-art').innerHTML=E.forms.flatMap(f=>['','-shiny','-mega','-shiny-mega'].map(v=>'<img class="creature" src="assets/events/halloween/'+f.key+v+'.webp" alt="'+f.name+v+'">')).join('')};document.querySelector('main').append(gallery);
const c=document.querySelector('#preview-title').getContext('2d');function frame(){c.clearRect(0,0,640,70);E.drawTitle(c,320,38);requestAnimationFrame(frame)}frame();
</script></html>
