<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Conta PSYWORLD</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071321;color:#eafaff;font:16px system-ui,sans-serif}
    main{width:min(480px,calc(100% - 40px));padding:26px;border:1px solid #47c9d5;border-radius:18px;background:#102238;text-align:center}
    h1{color:#ffe39a;font-size:24px}p{color:#b6cada;line-height:1.55}a{color:#80e4e1}
  </style>
</head>
<body>
  <main><h1>Conta PSYWORLD</h1><p>O Idle usa a conta principal já conectada ao PSYWORLD. Não há um login separado do Idle. O chat continua disponível sem login.</p><p id="status">Voltando ao jogo… <a href="/">Abrir PSYWORLD</a></p></main>
  <script>
    (()=>{
      const PENDING_KEY='psyIdleSocialOAuthPendingV1';
      try{localStorage.removeItem(PENDING_KEY)}catch(_){}
      try{history.replaceState(null,document.title,location.pathname+location.search)}catch(_){}
      setTimeout(()=>{try{location.replace('/')}catch(_){}},900);
    })();
  </script>
</body>
</html>
