<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Praia de teste</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #1b2a3a; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #ajuda { position: fixed; left: 10px; top: 10px; background: rgba(9, 25, 60, .85); color: #cfe8ff; padding: 8px 10px;
           font-size: 12px; line-height: 1.5; border: 1px solid #3f8fd6; max-width: 60vw; }
  #ajuda b { color: #ffd27a; }
  #joy { position: fixed; left: 16px; bottom: 16px; width: 124px; height: 124px; box-sizing: border-box; border-radius: 50%;
         background: rgba(10, 28, 60, .55); border: 2px solid #3f8fd6; touch-action: none; user-select: none; display: none; }
  #joy-knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; border-radius: 50%; background: #cfe8ff;
              transform: translate(-50%, -50%); pointer-events: none; }
  @media (pointer: coarse) { #joy { display: block; } }
  #acoes { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
  #acoes button { min-width: 124px; height: 44px; border: 2px solid #3f8fd6; background: rgba(9, 25, 60, .9); color: #fff;
                  font: 700 13px system-ui, sans-serif; border-radius: 4px; touch-action: manipulation; }
  #aviso-girar { position: fixed; inset: 0; z-index: 20; background: rgba(9, 14, 28, .94); color: #e2f1ff;
                 display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
                 padding: 24px; text-align: center; }
  #aviso-girar b { font-size: 18px; color: #facc15; }
  #aviso-girar p { margin: 0; font-size: 14px; color: #b8d4f2; max-width: 320px; line-height: 1.45; }
  #aviso-girar .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
  #aviso-girar button { padding: 10px 16px; border-radius: 8px; border: 2px solid #22d3ee; background: #132c52;
                        color: #fff; font: 700 14px system-ui; cursor: pointer; }
  #aviso-girar button.sec { border-color: #475569; background: rgba(30, 41, 59, .7); font-weight: 600; }
  @media (orientation: portrait) and (pointer: coarse) {
    body:not(.ignorar-giro) #aviso-girar { display: flex; }
  }
</style>
<script type="importmap">{"imports": {"three": "../vendor/three.module.min.js"}}</script>
</head>
<body>
<div id="aviso-girar">
  <div style="font-size:44px;line-height:1">📱↻</div>
  <b>Modo Paisagem (Deitado) Recomendado</b>
  <p>A arte 16:9 do mapa fica muito mais nítida com o celular deitado.</p>
  <div class="btns">
    <button id="btn-forcar-paisagem">Tela Cheia Deitado</button>
    <button id="btn-continuar-pe" class="sec">Continuar assim</button>
  </div>
</div>
<canvas id="cena"></canvas>
<details id="ajuda">
  <summary><b>Praia de teste</b> · controles</summary>
  <div class="ajuda-corpo">
    Separado das áreas jogáveis.<br>
    Toque: joystick para andar.<br>
    Teclado: WASD andar.
  </div>
</details>
<script>
  // no toque a ajuda começa fechada, para não cobrir a fachada
  document.getElementById('ajuda').open = !matchMedia('(pointer: coarse)').matches;
  document.getElementById('btn-forcar-paisagem').onclick = async () => {
    try {
      if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
      if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
    } catch (_) {}
    document.body.classList.add('ignorar-giro');
  };
  document.getElementById('btn-continuar-pe').onclick = () => document.body.classList.add('ignorar-giro');
</script>
<div id="joy" aria-label="Joystick para mover"><div id="joy-knob"></div></div>
<button id="abrir-editor" style="position:fixed;right:10px;top:10px;z-index:5;padding:8px 10px;border-radius:6px;border:2px solid #facc15;background:#0b1d3a;color:#fff;font:600 13px system-ui">Editar colisão</button>
<iframe id="editor-colisao" title="Editor de colisão" style="display:none;position:fixed;inset:0;width:100%;height:100%;border:0;z-index:10;background:#101822"></iframe>
<script>
  const ifr=document.getElementById("editor-colisao");
  document.getElementById("abrir-editor").onclick=()=>{ if(!ifr.src) ifr.src="editor-praia.html"; ifr.style.display="block"; };
  addEventListener("message",(e)=>{ if(e.data&&e.data.tipo==="fecharEditor") ifr.style.display="none"; });
</script>
<script type="module" src="./praia.js"></script>
</body>
</html>
