<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PSYWORLD · Região 1</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #0c1522; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #hud {
    position: fixed; left: 10px; right: 10px; top: 10px; z-index: 6;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; pointer-events: none;
  }
  #mapa-badge {
    pointer-events: auto; display: flex; align-items: center; gap: 8px;
    background: rgba(9, 18, 36, .88); border: 1.5px solid #3f8fd6; border-radius: 8px;
    padding: 6px 12px; color: #e2f1ff; font-size: 13px; box-shadow: 0 2px 10px rgba(0,0,0,.45);
  }
  #mapa-badge b { color: #facc15; letter-spacing: .2px; }
  #seletor-mapa {
    pointer-events: auto; background: rgba(9, 18, 36, .92); color: #e2f1ff;
    border: 1.5px solid #facc15; border-radius: 8px; padding: 6px 10px;
    font: 600 13px system-ui, sans-serif; cursor: pointer; max-width: 48vw;
  }

  #aviso-saida {
    position: fixed; left: 50%; top: 58px; transform: translateX(-50%); z-index: 7;
    padding: 10px 16px; border-radius: 8px; background: rgba(9, 18, 36, .94);
    border: 2px solid #facc15; color: #fff; font: 600 14px system-ui, sans-serif;
    display: none; text-align: center; max-width: 84vw; line-height: 1.35;
    box-shadow: 0 4px 16px rgba(0,0,0,.55);
  }

  #cortina-transicao {
    position: fixed; inset: 0; z-index: 15; background: #050912; opacity: 0;
    pointer-events: none; transition: opacity .16s ease;
  }
  #cortina-transicao.ativo { opacity: 1; }

  .seta-ind {
    position: fixed; z-index: 4; pointer-events: none; display: none;
    transform: translate(-50%, -50%); text-align: center;
    font: 700 11px system-ui, sans-serif; color: #fff;
    text-shadow: 0 1px 4px #000, 0 0 6px #000; max-width: 110px;
  }
  .seta-ind .tri { font-size: 22px; line-height: 1; }
  .seta-ind .lbl { margin-top: 1px; white-space: nowrap; }

  #joy {
    position: fixed; left: 16px; bottom: 16px; width: 124px; height: 124px; box-sizing: border-box;
    border-radius: 50%; background: rgba(10, 28, 60, .55); border: 2px solid #3f8fd6;
    touch-action: none; user-select: none; display: none; z-index: 5;
  }
  #joy-knob {
    position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; border-radius: 50%;
    background: #cfe8ff; transform: translate(-50%, -50%); pointer-events: none;
  }
  @media (pointer: coarse) { #joy { display: block; } }

  #aviso-girar {
    position: fixed; inset: 0; z-index: 25; background: rgba(9, 14, 28, .94); color: #e2f1ff;
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: 24px; text-align: center;
  }
  #aviso-girar b { font-size: 18px; color: #facc15; }
  #aviso-girar p { margin: 0; font-size: 14px; color: #b8d4f2; max-width: 320px; line-height: 1.45; }
  #aviso-girar .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
  #aviso-girar button {
    padding: 10px 16px; border-radius: 8px; border: 2px solid #22d3ee; background: #132c52;
    color: #fff; font: 700 14px system-ui, sans-serif; cursor: pointer;
  }
  #aviso-girar button.sec { border-color: #475569; background: rgba(30, 41, 59, .7); font-weight: 600; }
  @media (orientation: portrait) and (pointer: coarse) {
    body:not(.ignorar-giro) #aviso-girar { display: flex; }
  }
</style>
<script type="importmap">{"imports": {"three": "../vendor/three.module.min.js"}}</script>
</head>
<body>
<div id="aviso-girar">
  <div style="font-size:44px;line-height:1">📱↻</div>
  <b>Modo Paisagem (Deitado) Recomendado</b>
  <p>A arte 16:9 da Região 1 fica muito mais nítida com o celular deitado.</p>
  <div class="btns">
    <button id="btn-forcar-paisagem">Tela Cheia Deitado</button>
    <button id="btn-continuar-pe" class="sec">Continuar assim</button>
  </div>
</div>

<canvas id="cena"></canvas>

<div id="hud">
  <div id="mapa-badge"><b id="mapa-titulo">C0 · Praia Inicial</b></div>
  <select id="seletor-mapa" aria-label="Ir para mapa da Região 1"></select>
</div>

<div id="aviso-saida" role="status"></div>
<div id="setas-saidas"></div>
<div id="cortina-transicao"></div>
<div id="joy" aria-label="Joystick para mover"><div id="joy-knob"></div></div>

<script>
  document.getElementById('btn-forcar-paisagem').onclick = async () => {
    try {
      if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
      if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
    } catch (_) {}
    document.body.classList.add('ignorar-giro');
  };
  document.getElementById('btn-continuar-pe').onclick = () => document.body.classList.add('ignorar-giro');
</script>
<script type="module" src="./regiao1.js"></script>
</body>
</html>
