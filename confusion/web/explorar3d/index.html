<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Explorar 3D (protótipo)</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #0b1220; overflow: hidden; font: 600 15px/1.3 'Rajdhani', system-ui, sans-serif; color: #eef5ff; }
  canvas#cena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* painéis no estilo das telas do jogo: azul escuro, borda azul e canto cortado */
  .painel { position: fixed; background: linear-gradient(180deg, rgba(18, 44, 94, .96), rgba(9, 25, 60, .96)); border: 2px solid #3f8fd6; padding: 8px 12px; }
  #titulo { left: 14px; top: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #fff; font-size: 16px; }
  #local { left: 14px; top: 50px; padding: 3px 12px; font-size: 14px; font-weight: 700; color: #7fdcff; letter-spacing: .04em; }
  #msg { left: 50%; top: 70px; transform: translateX(-50%); display: none; width: max-content; max-width: min(420px, calc(100vw - 32px)); }
  #prompt { left: 50%; bottom: 66px; transform: translateX(-50%); display: none; color: #ffd27a; font-weight: 700; font-size: 16px; letter-spacing: .04em; }
  #atalhos { left: 50%; bottom: 66px; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px); font-size: 15px; }
  #atalhos p { margin: 3px 0; }
  #atalhos b { color: #ffd27a; }

  /* coluna da direita: mapa redondo com o nome acima e, abaixo, o registro de espólios */
  #direita { position: fixed; right: 14px; top: 12px; width: 270px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .rotulo { font-weight: 700; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 4px #000; }
  #mini-box { position: relative; width: 180px; height: 180px; border-radius: 50%; overflow: hidden; border: 3px solid rgba(255, 255, 255, .85); box-shadow: 0 0 0 4px rgba(10, 28, 60, .55), 0 0 18px rgba(127, 220, 255, .35); }
  #mini { display: block; width: 100%; height: 100%; }
  #registro { position: relative; width: 100%; box-sizing: border-box; padding: 14px 16px; cursor: pointer; background: linear-gradient(180deg, rgba(18, 44, 94, .96), rgba(9, 25, 60, .96)); border: 2px solid #3f8fd6; clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); animation: registro-entra .4s ease-out; }
  #registro h2 { margin: 0 0 8px; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; color: #ffd27a; text-shadow: 0 1px 4px #000; }
  #registro p { margin: 4px 0; color: #9fb6d9; }
  #registro .linha { display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 8px; padding: 6px 8px; margin: 5px 0; background: rgba(5, 15, 40, .6); border-left: 3px solid #7fdcff; font-size: 16px; animation: registro-entra .4s ease-out both; }
  #registro .icone { text-align: center; }
  #registro b { color: #ffd27a; }
  #registro .linha.gold { border-left-color: #ffd27a; }
  #registro .linha.mon { border-left-color: #b68cff; }
  #registro .linha.passe { border-left-color: #9fb6d9; }
  #registro .linha.ovo { border-left-color: #ffb347; }
  #registro .linha.ficha { border-left-color: #ff9ad5; }
  #registro .linha.esfera { border-left-color: #6fe39a; }
  #registro .linha.selecionado { background: #ffd27a; border-left-color: #fff; color: #0d2350; }
  #registro .linha.selecionado b { color: #0d2350; }
  @keyframes registro-entra { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }

  /* barra de ações embaixo, como a barra de atalhos da tela de referência */
  #barra { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 26px; white-space: nowrap; }
  .acao { background: none; border: 0; padding: 4px 2px; color: #fff; font: 700 17px/1 'Rajdhani', system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; cursor: pointer; text-shadow: 0 1px 4px #000; }
  .acao:disabled { opacity: .4; cursor: default; }
  .tecla { width: 26px; height: 26px; border-radius: 50%; background: #fff; color: #0d2350; display: grid; place-items: center; font-size: 14px; font-weight: 700; flex: none; }

  /* controles de toque: aparecem só em telas sensíveis ao dedo */
  #joy { position: fixed; left: 16px; bottom: 16px; width: 124px; height: 124px; box-sizing: border-box; border-radius: 50%; background: rgba(10, 28, 60, .55); border: 2px solid #3f8fd6; touch-action: none; user-select: none; -webkit-user-select: none; display: none; }
  #joy-knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; box-sizing: border-box; border-radius: 50%; background: rgba(159, 211, 255, .9); border: 2px solid #eaf5ff; pointer-events: none; }
  .botao { position: fixed; right: 16px; width: 124px; height: 52px; box-sizing: border-box; border: 2px solid #3f8fd6; background: linear-gradient(180deg, rgba(18, 44, 94, .96), rgba(9, 25, 60, .96)); color: #fff; font: 700 15px/1 'Rajdhani', system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; touch-action: manipulation; display: none; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
  #btn-centro { bottom: 16px; }
  #btn-examinar { bottom: 80px; background: #ffd27a; border-color: #ffd27a; color: #0d2350; }

  /* modo foto: some com a interface e deixa só a cena; P ou o botão de baixo voltam */
  #foto-sair { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: none; background: rgba(10, 28, 60, .85); border: 2px solid #3f8fd6; color: #fff; font: 700 15px 'Rajdhani', system-ui, sans-serif; padding: 6px 14px; letter-spacing: .05em; text-transform: uppercase; cursor: pointer; }
  body.foto #titulo, body.foto #local, body.foto #direita, body.foto #prompt, body.foto #msg, body.foto #atalhos,
  body.foto #barra, body.foto #joy, body.foto .botao { display: none !important; }
  body.foto #foto-sair { display: block; }

  /* tela de batalha: sobre a cena, no tom da tela de referência (escolha de membro, disco de ações e resultado) */
  #batalha { display: none; position: fixed; inset: 0; z-index: 30; overflow: hidden; background: none; }
  body.vista #batalha { background: radial-gradient(ellipse at 50% 35%, rgba(24, 56, 110, .9), rgba(5, 11, 28, .96)); }
  body.batalha #batalha { display: block; }
  body.batalha #titulo, body.batalha #local, body.batalha #direita, body.batalha #prompt, body.batalha #msg,
  body.batalha #atalhos, body.batalha #barra, body.batalha #joy, body.batalha .botao, body.batalha #foto-sair { display: none !important; }
  .bat-tela { position: absolute; inset: 0; }
  .bat-tela.escolha { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; box-sizing: border-box; }
  .bat-titulo { margin: 0; font-size: 26px; text-transform: uppercase; letter-spacing: .08em; color: #fff; border-bottom: 3px solid #ffd27a; padding-bottom: 6px; }
  .bat-selvagem { display: flex; align-items: center; gap: 14px; width: min(520px, 100%); box-sizing: border-box; padding: 10px 14px; background: rgba(9, 25, 60, .9); border: 2px solid #3f8fd6; }
  .bat-selvagem b { display: block; font-size: 20px; text-transform: uppercase; letter-spacing: .04em; }
  .bat-selvagem span { color: #7fdcff; }
  .bat-membros { list-style: none; margin: 0; padding: 0; width: min(520px, 100%); display: grid; gap: 8px; }
  .membro { width: 100%; display: grid; grid-template-columns: 64px 1fr; grid-template-areas: "arte nome" "arte meta" "arte barra"; align-items: center; gap: 2px 12px; box-sizing: border-box; padding: 8px 12px; background: rgba(9, 25, 60, .9); border: 2px solid #3f8fd6; color: #fff; text-align: left; font: inherit; cursor: pointer; }
  .membro.sel { background: #ffd27a; color: #0d2350; border-color: #fff; }
  .membro .nome { grid-area: nome; font-size: 19px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .membro .meta { grid-area: meta; font-size: 14px; opacity: .85; }
  .membro .barra { grid-area: barra; }
  .membro .sprite { grid-area: arte; width: 64px; height: 64px; animation: none; }
  .membro .orb { grid-area: arte; width: 56px; height: 56px; font-size: 28px; }
  .bat-acoes { display: flex; gap: 12px; }
  .bat-btn { background: linear-gradient(180deg, rgba(18, 44, 94, .96), rgba(9, 25, 60, .96)); color: #fff; border: 2px solid #3f8fd6; padding: 10px 18px; font: 700 17px/1 'Rajdhani', system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
  .bat-btn.primario { background: #ffd27a; color: #0d2350; border-color: #ffd27a; }
  .bat-btn kbd { font: 600 12px 'Rajdhani', system-ui, sans-serif; opacity: .7; margin-left: 8px; }
  .bat-pocoes { margin: 0; color: #9fb6d9; }

  .bat-topo { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; gap: 18px; align-items: center; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #fff; font-size: 15px; text-shadow: 0 1px 4px #000; }
  .bat-topo span:last-child { margin-left: auto; color: #ffd27a; }
  .bat-cartao { position: absolute; width: 380px; box-sizing: border-box; padding: 10px 14px; background: linear-gradient(180deg, rgba(18, 44, 94, .96), rgba(9, 25, 60, .96)); border: 2px solid #3f8fd6; clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); }
  .bat-cartao .cab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .bat-cartao .cab b { font-size: 19px; text-transform: uppercase; letter-spacing: .04em; }
  .bat-cartao .cab span { color: #7fdcff; font-size: 14px; white-space: nowrap; }
  .bat-cartao.ini { top: 56px; right: 24px; }
  .bat-cartao.jog { bottom: 40px; left: 24px; }
  .barra { height: 12px; background: rgba(5, 15, 40, .8); border: 1px solid #3f8fd6; overflow: hidden; }
  .barra i { display: block; height: 100%; background: linear-gradient(90deg, #ffd27a, #fff3c4); transition: width .7s ease; }
  .barra.baixa i { background: linear-gradient(90deg, #ff7070, #ffb3a0); }
  .barra.xp { height: 8px; }
  .barra.xp i { background: linear-gradient(90deg, #7fdcff, #cfeeff); }
  .bat-arte { position: absolute; pointer-events: none; }
  .bat-arte.ini-arte { top: 150px; right: 150px; }
  .bat-arte.jog-arte { bottom: 120px; left: 150px; }
  .sprite { width: 220px; height: 220px; object-fit: contain; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .6)); animation: bob 2.4s ease-in-out infinite; }
  .sprite.inimigo { transform: scaleX(-1); }
  .sprite.pequena { width: 90px; height: 90px; }
  .sprite.mini { width: 64px; height: 64px; }
  .orb { width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, var(--cor, #c9d6e3) 45%, #0a1c3c 100%); display: grid; place-items: center; font: 700 72px/1 'Rajdhani', system-ui, sans-serif; color: #0d2350; }
  .orb.pequena { width: 90px; height: 90px; font-size: 36px; }
  .orb.inimigo { transform: scaleX(-1); }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .sprite.inimigo { animation-name: bob-inimigo; }
  @keyframes bob-inimigo { 0%, 100% { transform: scaleX(-1) translateY(0); } 50% { transform: scaleX(-1) translateY(-6px); } }
  .bat-log { position: absolute; left: 24px; top: 150px; width: 300px; margin: 0; padding: 10px 12px 10px 30px; background: rgba(5, 15, 40, .75); border-left: 3px solid #7fdcff; font-size: 14px; color: #cfe8ff; }
  .bat-log li { margin: 2px 0; }
  .bat-log:empty { display: none; }
  .disco { position: absolute; right: 36px; bottom: 30px; width: 300px; height: 300px; }
  .disco-centro { position: absolute; left: 107px; top: 107px; width: 86px; height: 86px; box-sizing: border-box; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff, #7fdcff 40%, #1d4a8f 100%); border: 3px solid #fff; color: #0d2350; font-size: 30px; cursor: pointer; box-shadow: 0 0 22px rgba(127, 220, 255, .6); }
  .disco-item { position: absolute; width: 60px; height: 60px; box-sizing: border-box; border-radius: 50%; background: rgba(9, 25, 60, .95); border: 2px solid #3f8fd6; color: #fff; font-size: 24px; cursor: pointer; transition: transform .15s, background .15s; }
  .disco-item.sel { transform: scale(1.18); border-color: #fff; background: #ffd27a; color: #0d2350; box-shadow: 0 0 16px rgba(255, 210, 122, .7); }
  .disco-item.off { opacity: .35; cursor: default; }
  .disco-rotulo { position: absolute; left: -40px; right: -40px; top: -34px; text-align: center; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: .05em; font-size: 15px; text-shadow: 0 1px 4px #000; }
  .bat-dica { position: absolute; bottom: 10px; left: 24px; margin: 0; color: #9fb6d9; font-size: 13px; letter-spacing: .04em; }

  .bat-fim { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(460px, calc(100% - 32px)); box-sizing: border-box; padding: 18px 20px; display: grid; gap: 10px; background: linear-gradient(180deg, rgba(18, 44, 94, .96), rgba(9, 25, 60, .96)); border: 2px solid #3f8fd6; clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); }
  .bat-fim h2 { margin: 0; font-size: 34px; text-transform: uppercase; letter-spacing: .08em; }
  .bat-fim.vitoria h2 { color: #ffd27a; }
  .bat-fim.derrota h2 { color: #ff7070; }
  .bat-fim p { margin: 0; }
  .bat-log.grande { position: static; width: auto; max-height: 180px; overflow: auto; padding-left: 30px; }
  .bat-fim .bat-btn { justify-self: start; }

  .onirico { display: inline-block; white-space: nowrap; margin: 0 8px 0 8px; padding: 1px 8px; border: 1px solid #7fdcff; border-radius: 3px; color: #7fdcff; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; vertical-align: middle; }
  .bat-pop { position: absolute; transform: translate(-50%, -50%); font: 700 26px/1 'Rajdhani', system-ui, sans-serif; color: #fff; text-shadow: 0 0 6px #000, 0 2px 4px #000; pointer-events: none; animation: bat-pop .9s ease-out forwards; }
  .bat-pop.critico { color: #ffb347; font-size: 34px; }
  .bat-pop.erro { color: #cfe8ff; font-size: 22px; }
  .bat-pop.cura { color: #9dffb0; }
  .bat-pop.efi-super { color: #ffd27a; font-size: 20px; }
  .bat-pop.efi-pouco { color: #9fb6d9; font-size: 18px; }
  .bat-pop.efi-nulo { color: #ff7070; font-size: 18px; }
  @keyframes bat-pop { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -110%) scale(1); } }
  .bat-tela.luta.ocupado .disco-item { cursor: default; }
  .disco-item:disabled { cursor: default; }
  .disco-item { font: 700 22px/1 'Rajdhani', system-ui, sans-serif; }
  .bat-sub { margin: 0; color: #7fdcff; font-size: 16px; }
  .bat-dica-topo { margin: 0; color: #9fb6d9; font-size: 14px; text-align: center; max-width: 520px; }
  .bat-tela.habilidades { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; box-sizing: border-box; }
  .slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: min(560px, 100%); }
  .slot { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; background: rgba(9, 25, 60, .9); border: 2px solid #3f8fd6; color: #fff; font: 700 15px/1.1 'Rajdhani', system-ui, sans-serif; cursor: pointer; min-width: 0; }
  .slot.sel { border-color: #ffd27a; box-shadow: 0 0 14px rgba(255, 210, 122, .5); }
  .slot .nome-hab, .hab { overflow-wrap: anywhere; }
  .num { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #fff; color: #0d2350; font-weight: 700; font-size: 14px; flex: none; }
  .pool { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; width: min(560px, 100%); }
  .hab { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: rgba(9, 25, 60, .9); border: 2px solid #3f8fd6; color: #fff; font: 700 16px/1 'Rajdhani', system-ui, sans-serif; cursor: pointer; text-align: left; min-width: 0; }
  .hab.em { border-color: #7fdcff; }
  .hab.foco { background: #ffd27a; color: #0d2350; border-color: #fff; }
  .hab.foco .num { background: #0d2350; color: #ffd27a; }
  @media (max-width: 520px) { .slots { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pool { grid-template-columns: 1fr; } }
  @media (hover: none), (pointer: coarse) {
    #joy, .botao { display: block; }
    #barra, #atalhos { display: none !important; }
  }
  @media (max-width: 760px) {
    .bat-cartao { width: auto; }
    .bat-cartao.ini { top: 52px; left: 12px; right: 12px; }
    .bat-cartao.jog { bottom: 12px; left: 12px; width: 190px; }
    .bat-arte.ini-arte { top: 170px; right: 20px; }
    .bat-arte.jog-arte { bottom: 150px; left: 40px; }
    .sprite { width: 150px; height: 150px; }
    .sprite.pequena { width: 80px; height: 80px; }
    .orb { width: 130px; height: 130px; font-size: 54px; }
    .bat-cartao .cab { flex-direction: column; gap: 0; }
    .bat-log { top: 176px; bottom: auto; left: 12px; width: 240px; font-size: 13px; }
    .bat-log li:not(:last-child) { display: none; }
    .bat-topo { font-size: 13px; gap: 10px; flex-wrap: wrap; }
    .disco { width: 300px; height: 300px; right: 4px; bottom: 4px; transform: scale(.7); transform-origin: 100% 100%; }
    .bat-dica { display: none; }
    .bat-titulo { font-size: 22px; }
  }
  @media (max-width: 520px) {
    #direita { width: 250px; }
    #mini-box { width: 120px; height: 120px; }
    #registro { padding: 10px 12px; }
    #registro h2 { font-size: 16px; }
    #registro .linha { font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #registro, #registro .linha { animation: none; }
    .sprite, .sprite.inimigo { animation: none; }
  }

  /* batalha em equipe: até 3 aliados contra 1 a 3 inimigos, disco de ações, lista de habilidades e alvo */
  .bt { pointer-events: none; font-family: inherit; color: #eef5ff; }
  .bt button, .bt .bt-card, .bt .bt-log, .bt .bt-lista, .bt .bt-alvo, .bt .bt-topo { pointer-events: auto; }
  .bt-topo { position: absolute; left: 10px; right: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; background: linear-gradient(180deg, rgba(18, 44, 94, .94), rgba(9, 25, 60, .94)); border: 2px solid #3f8fd6; padding: 6px 10px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .bt-topo span:last-child { margin-left: auto; color: #ffd27a; }
  .bt-inimigos { position: absolute; right: 10px; top: 58px; width: 176px; display: flex; flex-direction: column; gap: 6px; }
  .bt-aliados { position: absolute; right: 10px; bottom: 150px; width: 176px; display: flex; flex-direction: column; gap: 6px; }
  .bt-card { display: block; width: 100%; box-sizing: border-box; text-align: left; background: linear-gradient(180deg, rgba(18, 44, 94, .95), rgba(9, 25, 60, .95)); border: 2px solid #3f8fd6; padding: 6px 8px; color: inherit; font: inherit; }
  .bt-card.ativo { border-color: #ffd27a; box-shadow: 0 0 0 2px rgba(255, 210, 122, .35); }
  .bt-card.alvo { border-color: #ff7a45; box-shadow: 0 0 0 2px rgba(255, 122, 69, .45); }
  .bt-card.ko { opacity: .4; }
  .bt-card:disabled { cursor: default; }
  .bt-cab { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; }
  .bt-cab span { color: #7fdcff; font-size: 11px; white-space: nowrap; }
  .bt-barra { height: 8px; background: #0b1530; border: 1px solid #3f8fd6; margin-top: 4px; }
  .bt-barra i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #7bd16b, #b7f08a); }
  .bt-barra.baixa i { background: linear-gradient(90deg, #ff7a45, #ffb39a); }
  .bt-num { font-size: 11px; text-align: right; color: #cfe8ff; }
  .bt-plano { font-size: 11px; color: #ffd27a; min-height: 14px; }
  .bt-log { position: absolute; left: 10px; top: 58px; width: 170px; margin: 0; padding: 6px 8px 6px 22px; background: rgba(5, 15, 40, .8); border-left: 3px solid #7fdcff; font-size: 11px; color: #cfe8ff; list-style: none; }
