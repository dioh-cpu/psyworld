    :root {

      --text: #eef2ff;
      --muted: #9aa5b8;
      --accent: #f59e0b;
      --green: #10b981;
      --btn: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px 12px 48px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    .wrap { max-width: 680px; margin: 0 auto; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; color: #fff; }
    .tips {
      background: #1c2230;
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .tips strong { color: var(--text); }
    .zip-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border-radius: 10px;
      background: #273043;
      border: 1px solid #3c4966;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
      transition: opacity 0.2s, border-color 0.2s;
    }
    .card.done {
      border-color: var(--green);
      opacity: 0.68;
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .card-title {
      font-weight: 700;
      font-size: 1.02rem;
    }
    .done-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      padding: 4px 8px;
      border-radius: 8px;
      background: #10131a;
      border: 1px solid var(--border);
    }
    .done-label input { width: 17px; height: 17px; accent-color: var(--green); }
    .preview-box {
      display: flex;
      justify-content: center;
      background: #090b0f;
      border-radius: 10px;
      padding: 8px;
      margin-bottom: 12px;
    }
    .preview-box img {
      max-height: 310px;
      width: auto;
      max-width: 100%;
      border-radius: 6px;
      display: block;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 10px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.92rem;
      border: none;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }
    .btn-dl {
      background: var(--btn);
      color: #fff;
    }
    .btn-copy {
      background: var(--accent);
      color: #111;
    }
    .btn-copy.copied {
      background: var(--green);
      color: #fff;
    }
    textarea {
      width: 100%;
      height: 92px;
      background: #0e1118;
      color: #cfd8ea;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      font-size: 0.8rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      resize: vertical;
    }
  </style>
</head>

    const list = document.getElementById("list");
    const saved = JSON.parse(localStorage.getItem("psyworld_npcs_done") || "{}");

    NPCS.forEach((npc) => {
      const imgUrl = `assets/confusion/npcs-flow-9x16/${npc.file}`;
      const card = document.createElement("div");
      card.className = "card" + (saved[npc.id] ? " done" : "");
      card.innerHTML = `
        <div class="card-head">
          <div class="card-title">${npc.title}</div>
          <label class="done-label">
            <input type="checkbox" ${saved[npc.id] ? "checked" : ""} />
            Feito
          </label>
        </div>
        <div class="preview-box">
          <img src="${imgUrl}" alt="${npc.title}" loading="lazy" />
        </div>
        <div class="actions">
          <a class="btn btn-dl" href="${imgUrl}" download="${npc.file}">⬇️ Baixar PNG</a>
          <button class="btn btn-copy" type="button">📋 Copiar Prompt</button>
        </div>
        <textarea readonly onclick="this.select()">${npc.prompt}</textarea>
      `;

      const cb = card.querySelector("input[type=checkbox]");
      cb.addEventListener("change", () => {
        saved[npc.id] = cb.checked;
        localStorage.setItem("psyworld_npcs_done", JSON.stringify(saved));
        card.classList.toggle("done", cb.checked);
      });

      const copyBtn = card.querySelector(".btn-copy");
      const ta = card.querySelector("textarea");
      copyBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(npc.prompt);
        } catch {
          ta.select();
          document.execCommand("copy");
        }
        copyBtn.textContent = "✅ Copiado!";
        copyBtn.classList.add("copied");
        setTimeout(() => {
          copyBtn.textContent = "📋 Copiar Prompt";
          copyBtn.classList.remove("copied");
        }, 1800);
      });

      list.appendChild(card);
    });

</body>
