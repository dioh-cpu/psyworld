          776d2d04184298e4d7ddc001cedf7c4d4c3010ae7016c9a2c5818388338bf280  fronteira2d/custom/copper-idle-8.png
          2215cd47033ebafc3f57486f6ac30a1a24c4922446838477c436920a5ce1dec0  fronteira2d/custom/copper-idle.png
          d675eea1ed2f2b0d50394c837a6f9a8e1f639804aae5e874ca9015e02efbb6fa  fronteira2d/custom/copper-idle.webp
