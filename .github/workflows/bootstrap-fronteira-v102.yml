          CHECKSUMS

      - name: Apply only the V102 mine collision fix
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch-fronteira-v102.py
          node --check fronteira2d/game.js
          test "$(sha256sum fronteira2d/game.js | awk '{print $1}')" = "2a0325bce60524494976ba1ad1b467eddf4f10bc42f4de1618b2b5bc68585322"
          grep -q "return floor/total<.25" fronteira2d/game.js
          grep -q "const magnus=" fronteira2d/game.js
          grep -q "const mineEntrance=" fronteira2d/game.js
          test "$(find fronteira2d/assets/map-tiles -maxdepth 1 -name 'tile-*.png' | wc -l)" -eq 16

      - name: Commit verified V102 Fronteira
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PSYWORLD Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html fronteira2d
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "V102: verified Fronteira Iris baseline and mine collision"
          git push origin HEAD:test/fronteira-iris-v102
