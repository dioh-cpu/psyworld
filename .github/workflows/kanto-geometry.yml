name: Kanto map geometry
on:
  push:
    branches: [main]
    paths:
      - 'core/kanto-map-data-v2.js'
      - 'core/kanto-collision-v4.js'
      - 'core/kanto-viridian-v1.js'
      - 'core/kanto-world-v2.js'
      - 'core/kanto-campaign-playable-v1.js'
      - 'css/kanto-world-v2.css'
      - 'index.html'
      - 'tests/kanto-viridian-v1.cjs'
      - 'tests/city-cloud-halloween-v1.cjs'
      - 'core/city-tap-navigation-v1.js'
      - 'core/city-quest-floating-v1.js'
      - 'core/cloud-save-v23.js'
      - 'core/online-authority-v26.js'
      - 'core/seasonal-event-v1.js'
      - 'api/player.js'
      - 'tests/kanto-campaign-menu-v65.cjs'
      - 'core/campaign-automation-v1.js'
      - 'core/kanto-gym-campaign-gate-v1.js'
      - 'core/hobbies-v1.js'
      - 'core/hobbies-v2.js'
      - 'core/professions-v1.js'
      - 'bundles/v47-survivor-hunts-v9.js'
      - 'modes/survivor.js'
      - 'tests/hobbies-unified-v2.cjs'
      - 'tests/kanto-gym-hobbies-v70.cjs'
      - 'tests/hobbies-ux-v3.cjs'
      - 'tests/hobbies-no-legacy-bonuses-v4.cjs'
      - 'core/kanto-city-cinematics-v1.js'
      - 'tests/kanto-tutorial-collision-v68.cjs'
      - '.github/workflows/kanto-geometry.yml'
  pull_request:
    paths:
      - 'core/kanto-map-data-v2.js'
      - 'core/kanto-collision-v4.js'
      - 'core/kanto-viridian-v1.js'
      - 'core/kanto-world-v2.js'
      - 'core/kanto-campaign-playable-v1.js'
      - 'css/kanto-world-v2.css'
      - 'index.html'
      - 'tests/kanto-viridian-v1.cjs'
      - 'tests/city-cloud-halloween-v1.cjs'
      - 'core/city-tap-navigation-v1.js'
      - 'core/city-quest-floating-v1.js'
      - 'core/cloud-save-v23.js'
      - 'core/online-authority-v26.js'
      - 'core/seasonal-event-v1.js'
      - 'api/player.js'
      - 'tests/kanto-campaign-menu-v65.cjs'
      - 'core/campaign-automation-v1.js'
      - 'core/kanto-gym-campaign-gate-v1.js'
      - 'core/hobbies-v1.js'
      - 'core/hobbies-v2.js'
      - 'core/professions-v1.js'
      - 'bundles/v47-survivor-hunts-v9.js'
      - 'modes/survivor.js'
      - 'tests/hobbies-unified-v2.cjs'
      - 'tests/kanto-gym-hobbies-v70.cjs'
      - 'tests/hobbies-ux-v3.cjs'
      - 'tests/hobbies-no-legacy-bonuses-v4.cjs'
      - 'core/kanto-city-cinematics-v1.js'
      - 'tests/kanto-tutorial-collision-v68.cjs'
permissions:
  contents: read
jobs:
  viridian-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check JavaScript syntax
        run: |
          node --version
          node --check core/kanto-map-data-v2.js
          node --check core/kanto-collision-v4.js
          node --check core/kanto-viridian-v1.js
          node --check core/kanto-world-v2.js
          node --check core/city-quest-floating-v1.js
          node --check core/city-tap-navigation-v1.js
          node --check core/cloud-save-v23.js
          node --check core/online-authority-v26.js
          node --check core/seasonal-event-v1.js
          node --check core/kanto-campaign-playable-v1.js
          node --check core/campaign-automation-v1.js
          node --check core/kanto-city-cinematics-v1.js
          node --check core/kanto-gym-campaign-gate-v1.js
          node --check core/hobbies-v2.js
          node --check core/professions-v1.js
          node --check bundles/v47-survivor-hunts-v9.js
          node --check core/hobbies-v1.js
      - name: Verify city tap, Halloween drops, cloud-save protection
        run: node tests/city-cloud-halloween-v1.cjs
      - name: Prevent blank tutorial on startup
        run: node tests/kanto-tutorial-collision-v68.cjs
      - name: Check unified Hobbies and Engineer progression
        run: node tests/hobbies-unified-v2.cjs
      - name: Check retirement of old profession bonuses
        run: node tests/hobbies-no-legacy-bonuses-v4.cjs
      - name: Check Hobbies field UI and fishing tension
        run: node tests/hobbies-ux-v3.cjs
      - name: Check story-first Gym and Hobbies
        run: node tests/kanto-gym-hobbies-v70.cjs
      - name: Check campaign menu, navigation and panel recovery
        run: node tests/kanto-campaign-menu-v65.cjs
      - name: Check Viridian routes, art ratio, encounters and load order
        run: node tests/kanto-viridian-v1.cjs
