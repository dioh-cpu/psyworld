<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confusion Waves: Double Perspective (piloto)</title>
<style>
:root{--bg:#0b0a12;--panel:#15131f;--fg:#e9e4f5;--muted:#9b93b5;--acc:#9333ea;--cy:#22d3ee;--warn:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px}
#app{max-width:820px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;margin:0;color:var(--cy)}
h2{font-size:15px;margin:0 0 8px;color:#d6c8ff}
section{background:var(--panel);border:1px solid #2a2440;border-radius:10px;padding:12px;margin:10px 0}
.status{color:var(--muted);font-size:13px}
.status b.fechada{color:var(--warn)}
.status b.aberta{color:var(--cy)}
button{background:#2b1b4a;color:var(--fg);border:1px solid #4b3a7a;border-radius:8px;padding:8px 12px;margin:4px 4px 4px 0;font:inherit;cursor:pointer}
button:hover{border-color:var(--acc)}
button:disabled{opacity:.4;cursor:default}
button.ghost{background:transparent}
button.danger{border-color:#7f1d1d}
label{display:inline-flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);margin-right:10px}
select,input{background:#0f0d18;color:var(--fg);border:1px solid #3b3260;border-radius:6px;padding:6px;font:inherit}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:6px}
.muted{color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.card{background:#0f0d18;border:1px solid #2a2440;border-radius:10px;padding:8px;font-size:13px}
.card img{width:100%;height:150px;object-fit:contain;background:#0b0a12;border-radius:8px}
.noart{height:150px;display:grid;place-items:center;color:var(--muted);background:#0b0a12;border-radius:8px}
.log{max-height:260px;overflow:auto;padding-left:18px;margin:0;font-size:13px;color:#cfc6e8}
.rar{font-weight:700}
.rar-comum{color:#9ca3af}
.rar-rara{color:#60a5fa}
.rar-epica{color:#a78bfa}
.rar-lendaria{color:#facc15}
.rar-mitica{background:linear-gradient(90deg,#f87171,#facc15,#4ade80,#22d3ee,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.sprite{position:relative;display:block;border-radius:12px;margin-bottom:6px}
.sprite.mini{display:inline-block;vertical-align:middle;width:64px;height:64px;margin:0;border-radius:10px}
.sprite.mini img{width:100%;height:100%;object-fit:contain;border-radius:10px;background:#0b0a12}
.sprite.mini .noart{height:64px;font-size:10px;padding:4px;text-align:center;border-radius:10px}
.sprite.mini .noart small{display:none}
.tag{display:inline-flex;align-items:center;gap:8px;margin:2px 10px 2px 0}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle;background:#4b3a7a}
.dot.aura-mutante-trevas{background:#7e22ce;box-shadow:0 0 8px 3px rgba(126,34,206,.7)}
.dot.aura-mutante-luz{background:#67e8f9;box-shadow:0 0 8px 3px rgba(103,232,249,.6)}
.dot.aura-abencoada{background:#facc15;box-shadow:0 0 8px 3px rgba(250,204,21,.6)}
.dot.aura-combinada{background:linear-gradient(90deg,#facc15,#a855f7);box-shadow:0 0 8px 3px rgba(168,85,247,.6)}
.sprite.aura-mutante-trevas{box-shadow:0 0 0 2px #7e22ce,0 0 26px 8px rgba(126,34,206,.6);animation:pulso-trevas 2.4s ease-in-out infinite}
.sprite.aura-mutante-luz{box-shadow:0 0 0 2px #67e8f9,0 0 26px 8px rgba(103,232,249,.5);animation:pulso-luz 2.4s ease-in-out infinite}
.sprite.aura-abencoada{box-shadow:0 0 0 2px #facc15,0 0 26px 8px rgba(250,204,21,.5);animation:pulso-bencao 3s ease-in-out infinite}
.sprite.aura-combinada{box-shadow:0 0 0 2px #facc15,0 0 0 4px #a855f7,0 0 34px 12px rgba(250,204,21,.55),0 0 60px 22px rgba(168,85,247,.45);animation:pulso-combinada 2s ease-in-out infinite}
@keyframes pulso-trevas{50%{box-shadow:0 0 0 2px #a855f7,0 0 34px 12px rgba(126,34,206,.75)}}
@keyframes pulso-luz{50%{box-shadow:0 0 0 2px #a5f3fc,0 0 34px 12px rgba(103,232,249,.65)}}
@keyframes pulso-bencao{50%{box-shadow:0 0 0 2px #fde68a,0 0 34px 12px rgba(250,204,21,.65)}}
@keyframes pulso-combinada{50%{box-shadow:0 0 0 2px #fde68a,0 0 0 4px #c084fc,0 0 42px 16px rgba(250,204,21,.7),0 0 70px 26px rgba(168,85,247,.6)}}
@media (prefers-reduced-motion: reduce){.sprite[class*="aura-"]{animation:none}}
</style>
</head>
<body>
<div id="app"><p>Carregando…</p></div>
<script type="module" src="confusion/web/app.js"></script>
</body>
</html>
