<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PSYWORLD • Asset probe V154</title>
  <style>
    body{margin:0;padding:32px;background:#07151d;color:#e7fbff;font:16px system-ui}
    main{max-width:720px;margin:auto;padding:24px;border:1px solid #49cbd4;border-radius:18px;background:#082532}
    h1{margin-top:0;color:#8deef3}pre{white-space:pre-wrap;color:#bde8e8}
  </style>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
  </script>
</head>
<body>
  <main>
    <h1>Teste de assets 3D V154</h1>
    <pre id="status">Carregando GLB e animações…</pre>
  </main>
  <script type="module">
    import { WILDLANDS_ASSETS } from './assets-v154.js';
    const status = document.querySelector('#status');
    try {
      const loaderModule = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js');
      const loader = new loaderModule.GLTFLoader();
      const creatureReport = [];
      for (const [key, asset] of Object.entries(WILDLANDS_ASSETS.creatures)) {
        const gltf = await new Promise((resolve, reject) => loader.load(asset.modelUrl, resolve, undefined, reject));
        creatureReport.push(key + ': ' + (gltf.animations || []).length + ' animações');
      }
      const environmentReport = [];
      for (const [key, asset] of Object.entries(WILDLANDS_ASSETS.environment).slice(0, 3)) {
        const gltf = await new Promise((resolve, reject) => loader.load(asset.modelUrl, resolve, undefined, reject));
        environmentReport.push(key + ': ' + gltf.scene.children.length + ' nós');
      }
      status.textContent = [
        'OK • 7 criaturas e 3 assets do mundo carregados',
        creatureReport.join('\\n'),
        environmentReport.join('\\n')
      ].join('\\n');
    } catch (error) {
      status.textContent = 'FALHA • ' + (error && error.message ? error.message : String(error));
      console.error(error);
    }
  </script>
</body>
</html>
